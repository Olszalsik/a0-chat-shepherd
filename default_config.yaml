enabled: true
watch_all: true
# v1.22.0 (stage 1): failure-diagnosis gates. Off disables the wedged-
# completion classifier (response logged but housekeeping never finished)
# and the later cause-gated remediation — the 1.21.3 timing ladder runs on.
diagnose_enabled: true
# v1.22.0 (stage 3): the supervisor's health check on itself. stale_tick_minutes
# is the "previous tick is too old" liveness threshold (the job loop sleeps a
# hard 60s, so 10 means "the tick overran or never finished"); notify_on_selfcheck
# pages via the framework notification when a fault persists
# (notify_after_minutes) with the re-arm window (notify_rearm_minutes).
selfcheck_enabled: true
selfcheck_every_minutes: 15
stale_tick_minutes: 10
notify_after_consecutive_failures: 3
notify_on_selfcheck: true
notify_degraded_after_failures: 3
# v1.22.0 (stage 4): write-ahead intents for remediation deliveries. The
# intent is recorded BEFORE the delivery and cleared after; a crash in
# between leaves a durable intent the next tick reconciles and CHARGES to
# the claimed action's budget (never replayed). inflight_timeout_minutes
# is how long an undelivered intent can linger before it is reaped.
inflight_enabled: true
inflight_timeout_minutes: 5
# v1.22.0 (stage 5): the operating window and the continuity wake.
# startup_grace_ticks holds auto-actions for the first N ticks after process
# start (a cold boot must not escalate immediately). active_hours suppress
# every automated action outside the window (start==end means always on;
# classification and blocking still run — the window gates execution only).
# continuity wake: the periodic health check that can bring work INTO
# existence (answer 'SHEPHERD_OK' quietly, alert otherwise). Off by default —
# it spends tokens on every fire.
startup_grace_ticks: 3
active_hours_enabled: false
active_hours_start: "09:00"
active_hours_end: "22:00"
active_hours_timezone: ""
goal_integration: true
external_block_integration: true
continuity_enabled: false
continuity_every_minutes: 30
continuity_max_wakes_per_day: 12
continuity_isolated: true
continuity_ack_max_chars: 300
continuity_prompt: ""
continuity_on_goal: true
continuity_on_nudge_exhaustion: true
continuity_on_intervention: true
continuity_intervention_minutes: 30
continuity_always: false
# v1.22.0 (stage 2): the causes the remediation ladder may act on. A stall
# whose newest failure classifies rate_limit / context_length / model_refusal
# is HELD, not nudged (visible on the dashboard, no auto-action), and a
# safety termination or auth failure is BLOCKED for a human no matter what
# this list contains — that floor is not configurable by design.
auto_remediate_categories:
  - tool_error
  - framework_crash
  - network
  - json_malformed
stall_minutes: 5
max_auto_nudges: 3
max_nudges_per_tick: 1
nudge_cooldown_minutes: 10
# WebUI dashboard refresh interval in seconds (2-120).
poll_seconds: 5
allowed_chat_ids: []
intervention_after_failed_nudges: true
notify_on_intervention: true
# v1.7.0 quiet bell: the intervention bell is persistence-gated. It rings
# only after a chat has needed human help continuously for
# notify_after_minutes (0 = page immediately); an ongoing episode is
# re-paged every notify_rearm_minutes (0 = one page per episode).
notify_after_minutes: 30
notify_rearm_minutes: 60
# v1.7.0: informational bell for the server-restart resume sweep
# (default off; the sidebar icons already surface this).
notify_on_resume: false
# v1.8.0 goal completion gate: when an agent declares its work done in
# a USER chat while its native goal-system goal is still open, it gets
# a silent nudge to finish the goal or close it with the goal tool.
goal_gate_enabled: true
goal_gate_max_nudges: 2
goal_gate_cooldown_minutes: 15
# v1.2.0 wedge remediation ladder: a running chat whose log is frozen for
# >= stall_minutes is wedged. After wedge_nudge_after_minutes it gets an
# automatic "continue" (Tier 1); when remediations are exhausted and
# wedge_soft_restart is true, the last attempt kills the hung task and
# re-sends the framework nudge (Tier 2, loses the hung call's output).
# wedge_max_remediations 0 disables wedge auto-remediation.
wedge_nudge_after_minutes: 10
wedge_max_remediations: 2
wedge_remediation_cooldown_minutes: 10
wedge_soft_restart: false
# v1.10.0 liveness probe: classify wedges via the log mutation counter
# (hung call vs spinning dead loop). Off restores the legacy ladder.
wedge_liveness_probe: true
# v1.23.0 provider-exhaustion retry loops: a running chat cycling "All chat
# model candidates exhausted"/"Critical error occurred, retrying..." with no
# assistant response for exhaustion_minutes is categorized provider_exhaustion
# and HELD (no nudges — a rate-limited chat cannot be continued into working),
# paged once per episode, and optionally killed when the futile loop has
# burned for exhaustion_kill_after_minutes (0 = never kill; a provider that
# recovers mid-run can still finish the job unattended).
exhaustion_minutes: 20
exhaustion_kill_after_minutes: 0
# v1.23.0 substantive-progress liveness: when on (>0), a running chat whose
# log entries keep advancing but that has produced no NEW assistant response
# for N minutes is treated as spinning_soft and routed down the classic wedge
# ladder (tier-1 continue first). 0 disables (default — retry markers alone
# already own the exhaustion class).
no_response_minutes: 0
# v1.23.0 stall escalation: when on, once max_auto_nudges are exhausted the
# chat gets exactly ONE soft restart (kill the dead task + framework nudge
# prompt) before flipping to intervention — escalation instead of giving up.
stall_escalate_to_restart: false
# v1.24.1: rate-limited soft-dependency probes (goal/heartbeat/paperclip
# availability) feeding the dashboard widget + self-check. Off — a probe
# run makes a tick eventful by design.
capabilities_probe_enabled: false
# R4 adaptive thresholds: opt-in feedback loop. When enabled, accumulated
# nudge/wedge remediation outcomes tune the three timing thresholds
# (nudge_cooldown_minutes, wedge_nudge_after_minutes,
# wedge_remediation_cooldown_minutes) as a runtime-only overlay: learned
# values live in plugin state, the persisted config is never overwritten,
# out-of-band configured values are pinned, Tier-2 and budgets untouched.
adaptive_thresholds: false
adaptive_interval_minutes: 60
adaptive_min_samples: 10
adaptive_step_pct: 10
# v1.16.0 supervised mode: when on, restart-resume and stalled-chat nudges
# are NOT sent automatically. Instead an editable draft message (tailored to
# the situation) is queued on the dashboard for human review; send or dismiss
# it there. Wedge remediation and the goal gate stay automatic.
supervised_mode: false
# v1.17.0 durability: minimum seconds between full state.json rewrites
# for quiet ticks (0 = legacy write every tick, max 180 to stay safely
# inside the 5-minute restart-detection gap). Eventful ticks - nudges,
# drafts, wedge actions, interventions, prunes, errors - always save now.
save_state_interval_seconds: 120
# R3 external alert channels (optional, off by default). webhook_url
# receives a JSON POST per alert; Telegram uses a bot token + chat id.
# Private/LAN webhook targets require webhook_allow_private: true.
webhook_url: ""
webhook_allow_private: false
telegram_bot_token: ""
telegram_chat_id: ""
icons:
  running: "🏃"
  stalled: "⚠️"
  nudged: "🔄"
  intervention: "🚨"
  blocked: "⛔"
  interrupted: "🔌"
  awaiting_user: "💬"
  error: "❌"
  paused: "⏸️"
  idle: ""
# v1.9.0 graceful reload: watch helpers between ticks and re-import
# them when their source changes (compile-gated, rollback on
# failure). Disable to fall back to restart-based deploys.
hot_reload_enabled: true
