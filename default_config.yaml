enabled: true
watch_all: true
stall_minutes: 5
max_auto_nudges: 3
max_nudges_per_tick: 1
nudge_cooldown_minutes: 10
# WebUI dashboard refresh interval in seconds (2-120).
poll_seconds: 5
allowed_chat_ids: []
intervention_after_failed_nudges: true
notify_on_intervention: true
# v1.7.0 quiet bell: the intervention bell is persistence-gated. It rings
# only after a chat has needed human help continuously for
# notify_after_minutes (0 = page immediately); an ongoing episode is
# re-paged every notify_rearm_minutes (0 = one page per episode).
notify_after_minutes: 30
notify_rearm_minutes: 60
# v1.7.0: informational bell for the server-restart resume sweep
# (default off; the sidebar icons already surface this).
notify_on_resume: false
# v1.8.0 goal completion gate: when an agent declares its work done in
# a USER chat while its native goal-system goal is still open, it gets
# a silent nudge to finish the goal or close it with the goal tool.
goal_gate_enabled: true
goal_gate_max_nudges: 2
goal_gate_cooldown_minutes: 15
# v1.2.0 wedge remediation ladder: a running chat whose log is frozen for
# >= stall_minutes is wedged. After wedge_nudge_after_minutes it gets an
# automatic "continue" (Tier 1); when remediations are exhausted and
# wedge_soft_restart is true, the last attempt kills the hung task and
# re-sends the framework nudge (Tier 2, loses the hung call's output).
# wedge_max_remediations 0 disables wedge auto-remediation.
wedge_nudge_after_minutes: 10
wedge_max_remediations: 2
wedge_remediation_cooldown_minutes: 10
wedge_soft_restart: false
# v1.10.0 liveness probe: classify wedges via the log mutation counter
# (hung call vs spinning dead loop). Off restores the legacy ladder.
wedge_liveness_probe: true
# R3 external alert channels (optional, off by default). webhook_url
# receives a JSON POST per alert; Telegram uses a bot token + chat id.
# Private/LAN webhook targets require webhook_allow_private: true.
webhook_url: ""
webhook_allow_private: false
telegram_bot_token: ""
telegram_chat_id: ""
icons:
  running: "🏃"
  stalled: "⚠️"
  nudged: "🔄"
  intervention: "🚨"
  interrupted: "🔌"
  awaiting_user: "💬"
  error: "❌"
  paused: "⏸️"
  idle: ""
# v1.9.0 graceful reload: watch helpers between ticks and re-import
# them when their source changes (compile-gated, rollback on
# failure). Disable to fall back to restart-based deploys.
hot_reload_enabled: true
